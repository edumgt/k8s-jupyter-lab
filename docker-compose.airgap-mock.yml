# Local air-gap rehearsal. This is not the VMware OVA install.
# First start needs network to pull base images and build app images.
# One-liner: bash scripts/quickstart_airgap_mock.sh
name: k8s-airgap-mock

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - airgap-mock-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - airgap-mock-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./apps/backend
      args:
        APP_ENV: dev
    image: k8s-airgap-mock-backend:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PLATFORM_ENV: airgap-mock
      PLATFORM_MONGO_URL: mongodb://mongodb:27017/platform
      PLATFORM_REDIS_URL: redis://redis:6379/0
      PLATFORM_BACKEND_URL: http://127.0.0.1:30081/docs
      PLATFORM_FRONTEND_URL: http://127.0.0.1:30080
      PLATFORM_CONTROL_PLANE_URL: http://127.0.0.1:30080/#control-plane
      PLATFORM_ADMIN_URL: http://127.0.0.1:30080/#sandbox-admin
      PLATFORM_AIRFLOW_URL: http://127.0.0.1:30090
      PLATFORM_JUPYTER_URL: http://127.0.0.1:30088/lab?token=platform123
      PLATFORM_GITLAB_URL: http://127.0.0.1:30089
      PLATFORM_NEXUS_URL: http://127.0.0.1:30091
      PLATFORM_PYPI_INDEX_URL: http://127.0.0.1:30091/repository/pypi-all/simple
      PLATFORM_NPM_REGISTRY: http://127.0.0.1:30091/repository/npm-all/
      PLATFORM_HARBOR_URL: http://127.0.0.1:30083
      PLATFORM_HARBOR_REGISTRY: 127.0.0.1:30083
      PLATFORM_HARBOR_PROJECT: data-platform
      PLATFORM_HARBOR_INSECURE_REGISTRY: "true"
      PLATFORM_TERADATA_FAKE_MODE: "true"
      PLATFORM_CORS_ALLOW_ORIGINS: http://127.0.0.1:30080,http://localhost:30080
      PLATFORM_CORS_ALLOW_CREDENTIALS: "true"
    ports:
      - "127.0.0.1:30081:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./apps/frontend
      args:
        APP_ENV: dev
        VITE_API_BASE_URL: http://127.0.0.1:30080
    image: k8s-airgap-mock-frontend:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:30080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  jupyter:
    build:
      context: ./apps/jupyter
    image: k8s-airgap-mock-jupyter:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      JUPYTER_TOKEN: platform123
      JUPYTER_ROOT_DIR: /workspace/user-home
    volumes:
      - airgap-mock-jupyter:/workspace/user-home
    ports:
      - "127.0.0.1:30088:8888"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/lab', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s

  edge-mocks:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/airgap-mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/airgap-mock/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:30083:8083"
      - "127.0.0.1:30089:8089"
      - "127.0.0.1:30090:8090"
      - "127.0.0.1:30091:8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

volumes:
  airgap-mock-mongo:
  airgap-mock-redis:
  airgap-mock-jupyter:
