server {
  listen 8083;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"harbor-mock","mode":"airgap-mock"}';
  }

  location = /api/v2.0/health {
    default_type application/json;
    return 200 '{"status":"healthy"}';
  }

  location / {
    try_files /harbor.html =404;
  }
}

server {
  listen 8089;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"gitlab-mock","mode":"airgap-mock"}';
  }

  location / {
    try_files /gitlab.html =404;
  }
}

server {
  listen 8090;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"airflow-mock","mode":"airgap-mock"}';
  }

  location / {
    try_files /airflow.html =404;
  }
}

server {
  listen 8091;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"nexus-mock","mode":"airgap-mock"}';
  }

  location = /repository/pypi-all/simple {
    default_type text/html;
    return 200 '<!DOCTYPE html><html><body><h1>pypi-all mock</h1><p>Local air-gap mock. No packages are served.</p></body></html>';
  }

  location /repository/npm-all/ {
    default_type application/json;
    return 200 '{"name":"airgap-mock","description":"Local Nexus npm mock. Not a package mirror."}';
  }

  location / {
    try_files /nexus.html =404;
  }
}
